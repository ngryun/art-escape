<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>탈출 코드 확인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .verify-form { display: grid; gap: 8px; }
    .verify-form label { font-size: 0.88rem; color: var(--ink-soft); margin-top: 6px; }
    .verify-form input {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 1.05rem;
      color: var(--ink); background: rgba(0,0,0,.3);
      border: 1px solid var(--line); border-radius: 6px;
    }
    .verify-form input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .verify-form .btn { margin-top: 12px; }
    .verdict { margin: 18px 0 0; padding: 14px; border-radius: 6px; text-align: center; font-weight: 700; }
    .verdict.ok { background: rgba(143,209,164,.12); color: var(--ok); border: 1px solid rgba(143,209,164,.4); }
    .verdict.bad { background: rgba(226,120,107,.12); color: var(--danger); border: 1px solid rgba(226,120,107,.4); }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">교사용</p>
    <h1 class="title">탈출 코드 확인</h1>
    <div class="frame">
      <form id="f" class="verify-form" autocomplete="off">
        <label for="v-name">이름 (학생 화면에 보이는 그대로)</label>
        <input id="v-name" required>
        <label for="v-time">탈출 시간 (예: 07:42)</label>
        <input id="v-time" inputmode="numeric" placeholder="mm:ss" required>
        <label for="v-code">인증 코드 (6자리)</label>
        <input id="v-code" maxlength="6" required style="text-transform:uppercase;letter-spacing:.2em">
        <button class="btn btn-gold" type="submit">확인</button>
      </form>
      <p id="verdict" class="verdict" hidden></p>
    </div>
    <p class="note">이름·시간·코드가 모두 학생 화면과 같아야 '진짜'로 판정됩니다.</p>
  </main>
  <script src="common.js"></script>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("v-name").value;
      let time = document.getElementById("v-time").value.trim();
      // "742" 또는 "7:42" 처럼 입력해도 mm:ss로 맞춤
      const m = time.match(/^(\d{1,3})\D?(\d{2})$/);
      if (m) time = `${m[1].padStart(2, "0")}:${m[2]}`;
      const code = document.getElementById("v-code").value.trim().toUpperCase();
      const v = document.getElementById("verdict");
      const expected = await EscapeCommon.escapeCode(name, time);
      v.hidden = false;
      if (expected === code) {
        v.className = "verdict ok";
        v.textContent = `진짜 탈출 기록입니다. (${EscapeCommon.normName(name)}, ${time})`;
      } else {
        v.className = "verdict bad";
        v.textContent = "일치하지 않습니다. 이름(띄어쓰기 포함)과 시간을 다시 확인하세요.";
      }
    });
  </script>
</body>
</html>
