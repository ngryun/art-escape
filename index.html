<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>밤의 미술관 탈출</title>
  <meta name="description" content="3D 전시실을 둘러보며 교과서 속 작품을 찾고, 그 작품이 실린 쪽 번호로 문을 여는 미술 방탈출">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">

  <canvas id="gl" aria-label="3D 전시실. 화면을 끌어서 둘러보고, 작품과 문을 눌러 조사합니다."></canvas>
  <div id="vignette"></div>

  <!-- HUD -->
  <div class="hud" id="hud-tl" hidden>
    <div class="room-no" id="hud-no"></div>
    <div class="room-title" id="hud-name"></div>
    <ol class="dots" id="hud-dots" aria-label="진행 상황"></ol>
  </div>
  <div class="hud" id="hud-tr" hidden>
    <span class="chip" id="timer" aria-label="경과 시간">00:00</span>
    <button class="chip" id="btn-art" type="button" hidden>작품 보기</button>
    <button class="chip chip-gold" id="btn-lock" type="button" hidden>자물쇠</button>
  </div>
  <div class="hud" id="hud-b" hidden>
    <p id="guide"></p>
  </div>
  <div id="toast" class="off" role="status"></div>

  <!-- 시작 화면 -->
  <section id="start">
    <div class="start-box">
      <p class="eyebrow">미술 창작 · 교과서 방탈출</p>
      <h1>밤의 <em>미술관</em><br>탈출</h1>
      <p class="story">관람 시간이 끝난 줄도 모르고 작품을 보다가 그만 미술관에 갇혀 버렸다. 다섯 전시실의 출구마다 숫자 자물쇠가 걸려 있다.</p>
      <p class="story">전시실 어딘가에 걸린 작품을 찾아라. 그 작품이 실린 <strong>교과서 쪽 번호</strong>가 바로 자물쇠의 비밀번호다.</p>

      <div id="resume-box" class="resume" hidden>
        <p id="resume-text"></p>
        <div class="row">
          <button id="btn-resume" class="btn" type="button">이어 하기</button>
          <button id="btn-reset-start" class="btn ghost" type="button">처음부터</button>
        </div>
      </div>

      <form id="start-form" class="start-form" autocomplete="off">
        <label for="player-name">이름 (학번 포함 가능)</label>
        <div class="row">
          <input id="player-name" type="text" maxlength="20" placeholder="예: 10101 홍길동" required>
          <button class="btn" type="submit">미술관 입장</button>
        </div>
      </form>
      <p class="note">화면을 끌어서 360도로 둘러보고, 빛나는 것을 눌러 조사해요. 교과서를 꼭 옆에 펼쳐 두세요.</p>
    </div>
  </section>

  <!-- 카드 -->
  <div id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  <div id="fade"></div>

  <noscript><p class="fallback">이 게임은 자바스크립트가 필요해요.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="common.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
